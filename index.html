<!DOCTYPE html>
<html>
<head>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #2b2b2b;
    overflow: hidden;
  }
  .ticker-wrap {
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    overflow: hidden;
    white-space: nowrap;
    box-sizing: border-box;
  }
  .ticker {
    display: inline-block;
    padding-left: 100%;
    color: #ffffff;
    font-family: Arial, sans-serif;
    font-size: 15px;
    font-weight: bold;
    animation: none;
  }
  .ticker.scrolling {
    animation: ticker-scroll 30s linear 1;
  }
  @keyframes ticker-scroll {
    0%   { transform: translate3d(0, 0, 0); }
    100% { transform: translate3d(-100%, 0, 0); }
  }
</style>
</head>
<body>
  <div class="ticker-wrap">
    <div class="ticker" id="tickerText">Loading...</div>
  </div>

<script>
  // ---- Edit this list with your own safety tips ----
  const safetyTips = [
    "⚠️ Report leaks and drips before they become floods.",
    "⚠️ Wet floors get a sign — every time, no exceptions.",
    "⚠️ Check ladders for damage before you climb.",
    "⚠️ Never overload extension cords or power boards.",
    "⚠️ Keep fire exits and stairwells clear of clutter.",
    "⚠️ Test smoke alarms monthly, replace batteries yearly.",
    "⚠️ Report flickering lights or exposed wiring immediately.",
    "⚠️ Trim trees and hedges clear of walkways and signage.",
    "⚠️ Grit or salt icy paths before someone slips.",
    "⚠️ Secure loose paving, steps, and handrails promptly.",
    "⚠️ Check playground equipment for wear each week.",
    "⚠️ Fence off and sign any pool maintenance work.",
    "⚠️ Store cleaning chemicals locked and clearly labelled.",
    "⚠️ Never mix cleaning chemicals — check the label first.",
    "⚠️ Wear gloves when handling bins and waste.",
    "⚠️ Report broken glass or sharp debris right away.",
    "⚠️ Keep gutters clear to prevent water damage.",
    "⚠️ Check carbon monoxide detectors in shared plant rooms.",
    "⚠️ Isolate power before touching any electrical fitting.",
    "⚠️ Barricade work areas before starting repairs.",
    "⚠️ Use the right ladder for the job — never stand on chairs.",
    "⚠️ Lift with your legs, not your back.",
    "⚠️ Two-person lift for anything heavy or awkward.",
    "⚠️ Keep pathways well lit — report outages promptly.",
    "⚠️ Check fire extinguisher tags are current.",
    "⚠️ Never prop open fire doors.",
    "⚠️ Report mould or damp before it spreads.",
    "⚠️ Keep garden tools stored safely, not left lying around.",
    "⚠️ Watch for trip hazards — hoses, cords, and tools.",
    "⚠️ Wear high-vis when working near driveways or car parks.",
    "⚠️ Check handrails on stairs and ramps regularly.",
    "⚠️ Log every repair, however small, so nothing gets missed.",
    "⚠️ Take care around communal BBQs and gas bottles.",
    "⚠️ Report faulty gate latches and broken locks.",
    "⚠️ Keep the plant room tidy — clutter is a fire risk.",
    "⚠️ Wear a mask when sweeping dusty or mouldy areas.",
    "⚠️ Check first aid kits are stocked and in date.",
    "⚠️ Never leave tools or ladders unattended in public areas.",
    "⚠️ Report broken glass in windows or common doors.",
    "⚠️ Keep chemical storage well ventilated.",
    "⚠️ A five-minute check now can prevent a costly repair later.",
    "⚠️ Report water pooling near buildings — it may signal a leak.",
    "⚠️ Don't ignore odd smells — gas or electrical, report it.",
    "⚠️ Keep emergency contact numbers visible and up to date.",
    "⚠️ Check smoke detectors in common hallways monthly.",
    "⚠️ Store sharp tools safely, blades covered when not in use.",
    "⚠️ Wear sun protection for outdoor maintenance work.",
    "⚠️ Stay hydrated — especially during outdoor summer tasks.",
    "⚠️ Small fixes now prevent bigger hazards later.",
    "⚠️ If something looks unsafe, tape it off and report it.",
    "⚠️ No job is so urgent it cannot be done safely.",
    "⚠️ Stop work if it is unsafe.",
    "⚠️ Plan the work, then work the plan.",
    "⚠️ Risk assess before you begin.",
    "⚠️ Never bypass safety controls.",
    "⚠️ Report near misses immediately.",
    "⚠️ Good housekeeping prevents accidents.",
    "⚠️ Deferred maintenance creates risk.",
    "⚠️ Protect people, assets, and the environment.",
    "⚠️ A job is only complete when it is completed safely."
  ];

  const tickerEl = document.getElementById('tickerText');
  let remaining = [];

  // Fisher-Yates shuffle
  function shuffle(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function nextTip() {
    if (remaining.length === 0) {
      remaining = shuffle(safetyTips);
    }
    return remaining.pop();
  }

  function showNextTip() {
    // Remove animation, reset position, force reflow
    tickerEl.classList.remove('scrolling');
    tickerEl.style.transform = 'translate3d(0,0,0)';
    tickerEl.textContent = nextTip();

    // Force reflow so the animation restarts cleanly
    void tickerEl.offsetWidth;

    tickerEl.classList.add('scrolling');
  }

  // Kick off the first tip, then advance when each scroll finishes
  showNextTip();
  tickerEl.addEventListener('animationend', showNextTip);
</script>
</body>
</html>
